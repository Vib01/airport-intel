name = "airport-intel"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
# CONTACT_EMAIL is a secret (never committed): npx wrangler secret put CONTACT_EMAIL
# It is only sent in the upstream User-Agent. Locally, put it in worker/.dev.vars if wanted.
FEATURE_SCHEDULE = "false"
# Comma-separated extra CORS origins (exact match). thevibs.com and localhost are always allowed.
EXTRA_ORIGINS = "https://airport-intel-xi.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "airport-intel"
# Created with: npx wrangler d1 create airport-intel (region ENAM)
database_id = "f31efc66-9d0d-48b4-a87f-cc77200ad1ec"
migrations_dir = "migrations"

[observability]
enabled = true
