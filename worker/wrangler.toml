name = "airport-intel"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
# Set your real contact address with: npx wrangler secret put CONTACT_EMAIL
# (a secret overrides this placeholder). It is only sent in the upstream User-Agent.
CONTACT_EMAIL = ""
FEATURE_SCHEDULE = "false"
# Comma-separated extra CORS origins (exact match). thevibs.com and localhost are always allowed.
EXTRA_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "airport-intel"
# Replace with the id printed by: npx wrangler d1 create airport-intel
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
