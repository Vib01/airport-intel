name: Worker — test & deploy

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  # Deploys only when the repo has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
  # Without them, deploy manually: cd worker && npx wrangler deploy
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler d1 migrations apply airport-intel --remote
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: echo "No CLOUDFLARE_API_TOKEN secret — skipped deploy (deploy manually with wrangler)."
        if: env.CLOUDFLARE_API_TOKEN == ''
